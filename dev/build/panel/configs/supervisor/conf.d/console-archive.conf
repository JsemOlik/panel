[program:console-archive]
process_name=%(program_name)s
user=www-data
autostart=true
autorestart=true
startretries=5
; Long-lived console/chat archive ingestion daemon — see
; app/Console/Commands/ConsoleArchive/ConsumeConsoleArchiveCommand.php. This belongs under
; Supervisor (autorestart on crash) next to the queue worker in worker.conf, NOT the `cron`
; program above or Kernel::schedule() — it holds open websocket connections for the life of the
; process rather than running to completion.
command=/usr/bin/php /var/www/html/artisan p:console-archive:consume -v
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
